<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<title>Slim</title>
	<style>
		body{
			background-color: black;
			color: white;
			display:flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			height: 100vh;
		}
		.slim {
			display:flex;
			gap: 10px;
			margin-top: 20px;
		}
		input {
			padding: 10px;
			width: 300px;
		}
		button{
			padding:10px;
		}
			</style>
</head>
	<body>
    <h1 id="titre">I am Slim</h1>
    <p id="message"> Hello </p>
		<div class="slim">
			<input type="text" placeholder="vasy envoie frro">
			<button>Envoyer</button>
		</div>
	<script>
		const barre = document.querySelector ("imput");
		barre.addEventListener("imput" , function() {
			if (barre.value.length>0) {
				document.getElementById("titre").style.display = "none";
				document.getElementById("message").style.display = "none";
			}
		});
			</script>
	</body>
</html>
